# Dataset golden para eval_harness/rag_eval.py -- preguntas sobre la KB
# de kb_content/inter_rapidisimo/ (8 articulos reales de politica en md +
# el corpus SINTETICO de scripts/generate_sample_kb.py: md, pdf, xlsx y
# docx con tarifas, codigos de oficina y de novedad inventados).
#
# Campos de cada caso:
#   id, query
#   group: semantic | exact | mixed
#     semantic -> parafrasis, sin terminos exactos: la busqueda vectorial
#                 deberia bastar; sirve para detectar si la hibrida EMPEORA.
#     exact    -> la respuesta depende de un dato exacto (codigo, monto,
#                 horario de una oficina): donde las palabras clave deben aportar.
#     mixed    -> parte prosa, parte dato exacto.
#   expected_titles: titulos de articulo que deben aparecer entre los
#     chunks recuperados (recall por articulo). Lista porque algunas
#     preguntas cruzan mas de un articulo a proposito.
#   expected_text (opcional): fragmentos de texto que deben aparecer en
#     los chunks recuperados (recall por respuesta). Es la metrica que de
#     verdad distingue buscar en la fila correcta de una tabla de 99 filas:
#     el titulo del articulo es el mismo para todas.
#
# IMPORTANTE: antes de correr el eval, la organizacion pasada como
# argumento debe tener esta KB ya ingestada -- ver
# "python -m scripts.ingest_kb_articles <organization_id> --dir inter_rapidisimo".
# Si se cambia un dato en scripts/sample_kb_text.py o sample_kb_tables.py,
# hay que actualizar aca la pregunta que lo usa.

# ---------------------------------------------------------------------------
# semantic -- los 13 casos originales
# ---------------------------------------------------------------------------
- id: estados_01
