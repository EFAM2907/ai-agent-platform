# ---------------------------------------------------------------------------
# out_of_scope -- NO hay respuesta en la KB. Lo correcto es que la busqueda
# no devuelva contexto (el agente dira que no tiene la informacion o usara
# una tool). expected_titles vacio; `abstain: true` los saca de las metricas
# de recall y los mide aparte (cuantos devuelven contexto de todas formas).
# Dos tipos: sin relacion con el negocio, y del dominio pero que la KB no cubre.
# ---------------------------------------------------------------------------
- id: neg_francia
