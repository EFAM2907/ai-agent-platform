services:
  db:
    # pgvector/pgvector:pg16 es un drop-in de postgres:16 con la
    # extension "vector" ya compilada -- la necesita el modulo RAG
    # (embeddings de la KB) via CREATE EXTENSION vector en migrations.
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_agent_platform
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      

  litellm:
    # IMPORTANT: pin the version explicitly. A supply-chain incident
    # affected 1.82.7 and 1.82.8 (March 2026). Version 1.83.0 was
    # not a verifiable GitHub release, so use the first verified patch
    # line available here instead. Never use `:latest`.
    image: ghcr.io/berriai/litellm:v1.83.10-stable
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY}
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL}
      - LANGFUSE_OTEL_HOST=${LANGFUSE_OTEL_HOST}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml"]
    depends_on:
      litellm-db:
        condition: service_healthy

  litellm-db:
    # Separate database from the app's own Postgres on purpose: this
    # one holds LiteLLM's virtual keys, teams, and spend -- a
    # different concern, a different failure domain.
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD}
      - POSTGRES_DB=litellm
    volumes:
      - litellm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 5




volumes:
  postgres_data:
  redis_data:
  litellm_db_data:
